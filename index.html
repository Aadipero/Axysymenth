<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smytten Auto Refer — Pro Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; padding: 15px; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; background: #131826; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #1f293d; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #fff; }
        .header p { font-size: 12px; color: #9ca3af; }
        
        .card { background: #1a2236; border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid #26334d; }
        .stat-box { text-align: center; }
        .stat-box h2 { font-size: 32px; color: #34d399; margin-top: 5px; }
        .stat-box span { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }

        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .col { flex: 1; background: #1a2236; padding: 12px; border-radius: 12px; border: 1px solid #26334d; }
        .col span { font-size: 11px; color: #9ca3af; display: block; margin-bottom: 4px; }
        .col b { font-size: 14px; color: #fff; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; background: #1a2236; color: #9ca3af; border: 1px solid #26334d; }
        .tab-btn.active { background: #7c3aed; color: #fff; border-color: #8b5cf6; box-shadow: 0 0 15px rgba(124,58,237,0.4); }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; background: #0f1523; border: 1px solid #26334d; border-radius: 10px; padding: 12px; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus, .input-group textarea:focus { border-color: #8b5cf6; }

        .btn { width: 100%; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 5px; box-shadow: 0 4px 12px rgba(124,58,237,0.3); }
        .btn:active { transform: scale(0.98); }

        .log-box { background: #090d16; border-radius: 12px; padding: 12px; height: 160px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #a7f3d0; border: 1px solid #1f293d; margin-top: 15px; }
        .note { font-size: 11px; color: #9ca3af; margin-top: 12px; line-height: 1.4; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="background: linear-gradient(135deg, #ec4899, #8b5cf6); width: 45px; height: 45px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px;">🛍️</div>
        <div>
            <h1>Smytten Auto</h1>
            <p>Smytten Pro Panel — Fixed</p>
        </div>
    </div>

    <div class="card stat-box">
        <span>Verified Refer Count</span>
        <h2 id="totalRefCnt">0</h2>
    </div>

    <div class="row">
        <div class="col">
            <span>MODE</span>
            <b id="proxyStatus" style="color: #34d399; font-size: 12px;">Active (Fixed)</b>
        </div>
        <div class="col">
            <span>STATUS</span>
            <b id="botStatus" style="color: #fbbf24;">Idle</b>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('manual')">📱 Manual</button>
        <button class="tab-btn" onclick="switchTab('firebase')">🔥 Firebase Auto</button>
    </div>

    <!-- MANUAL MODE SECTION -->
    <div id="manualSection">
        <div class="input-group">
            <label>Mobile Number (10 digit)</label>
            <input type="text" id="mPhone" placeholder="9876543210" maxlength="10">
        </div>
        <div class="input-group">
            <label>Referral Code</label>
            <input type="text" id="mRefCode" value="Ng90M41">
        </div>
        <button class="btn" onclick="startManualProcess()" id="mainActionBtn">Send Real OTP</button>
        
        <div id="otpBox" class="input-group hidden" style="margin-top: 12px;">
            <label>Enter Real 4-Digit OTP</label>
            <input type="text" id="mOtp" placeholder="1234" maxlength="4">
            <button class="btn" onclick="verifyAndSubmitOtp()" style="margin-top: 8px; background: #059669;">Verify & Credit Refer</button>
        </div>
    </div>

    <!-- FIREBASE AUTO MODE SECTION -->
    <div id="firebaseSection" class="hidden">
        <div class="input-group">
            <label>Firebase Panels (line by line)</label>
            <textarea id="fbPanels" rows="3" placeholder="https://panel1.firebaseio.com/&#10;https://panel2.firebaseio.com/"></textarea>
        </div>
        <div class="row" style="margin-bottom: 5px;">
            <div class="input-group" style="flex: 2;">
                <label>Referral Code</label>
                <input type="text" id="fbRefCode" value="Ng90M41">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Target</label>
                <input type="number" id="fbTarget" value="3">
            </div>
        </div>
        <button class="btn" onclick="startFirebaseAuto()" style="background: #d97706;">Start Firebase Scanner</button>
    </div>

    <div class="note">
        🔒 Default Code: `Ng90M41` | Fully fixed parser & OTP handlers.
    </div>

    <div style="margin-top: 15px; font-size: 12px; font-weight: 600; color: #9ca3af; margin-bottom: 5px;">⚡ Live Process Log</div>
    <div class="log-box" id="logBox">
        [System] Fixed panel parser loaded with Ng90M41<br>
    </div>
</div>

<script>
    let tempSessionData = {};

    function log(msg) {
        const box = document.getElementById('logBox');
        const time = new Date().toTimeString().split(' ')[0];
        box.innerHTML += `[${time}] ${msg}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(tab === 'manual') {
            document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            document.getElementById('manualSection').classList.remove('hidden');
            document.getElementById('firebaseSection').classList.add('hidden');
        } else {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('manualSection').classList.add('hidden');
            document.getElementById('firebaseSection').classList.remove('hidden');
        }
    }

    function generateDeviceId() {
        return Array.from({length: 16}, () => Math.floor(Math.random()*16).toString(16)).join('');
    }

    function generateUuid() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            var r = Math.random()*16|0, v = c == 'x' ? r : (r&0x3|0x8);
            return v.toString(16);
        });
    }

    async function callSmyttenApi(endpoint, payload, method = 'POST', sessionId = null) {
        const targetUrl = `https://route.smytten.com${endpoint}`;
        const headers = {
            "gender": "male",
            "app_version": "228",
            "app_platform": "android",
            "last_app_open": String(Date.now()),
            "Content-Type": "application/json; charset=UTF-8",
            "User-Agent": "okhttp/4.10.0"
        };
        if(sessionId) headers["session_id"] = sessionId;
        if(endpoint.includes('update_profile')) headers["user_type"] = "18";

        try {
            const res = await fetch(`https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl), {
                method: method,
                headers: headers,
                body: JSON.stringify(payload)
            });
            return await res.json();
        } catch(err) {
            try {
                const resFallback = await fetch(`https://corsproxy.io/?` + encodeURIComponent(targetUrl), {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                return await resFallback.json();
            } catch(e) {
                log(`[-] API Error: ${e.message}`);
                return null;
            }
        }
    }

    async function startManualProcess() {
        const phone = document.getElementById('mPhone').value.trim();
        const refCode = document.getElementById('mRefCode').value.trim();

        if(!phone || phone.length !== 10) {
            alert('Please enter a valid 10-digit mobile number.');
            return;
        }

        document.getElementById('botStatus').innerText = 'Sending...';
        document.getElementById('botStatus').style.color = '#3b82f6';
        log(`[+] Requesting real OTP for ${phone} ...`);

        const payload = {
            "app_installer": "com.android.vending",
            "device_id": generateDeviceId(),
            "app_version": "10.2.8",
            "recaptcha_token": "",
            "app_signature": "",
            "guest_user_access": true,
            "ad_id": generateUuid(),
            "device_info": {"version_code": "12", "model": "SM-S9260", "incremental": "465", "display_ui": "V417IR", "brand": "Samsung"},
            "device_token": `${generateUuid().substring(0,22)}:APA91b${generateDeviceId()}`,
            "package_name": "com.app.smytten",
            "device_platform": "android",
            "app_path": "/data/user/0/com.app.smytten/files",
            "pincode_details": {"Answer": "New Delhi, India", "AnswerType": "ip"},
            "value": phone
        };

        const data = await callSmyttenApi("/discover_user/users/loginViaNumberV2", payload, 'POST');
        if(!data) {
            alert('Network error or CORS block. Try again.');
            document.getElementById('botStatus').innerText = 'Idle';
            return;
        }

        const isNew = data?.content?.is_new_user ?? data?.content?.newUser ?? true;
        if(isNew === false) {
            log(`[!] Number ${phone} is already registered on Smytten!`);
            alert('This number is already registered.');
            document.getElementById('botStatus').innerText = 'Idle';
            return;
        }

        log(`[✓] OTP dispatched successfully to ${phone}`);
        tempSessionData = { phone, refCode };
        document.getElementById('otpBox').classList.remove('hidden');
        document.getElementById('mainActionBtn').style.display = 'none';
        document.getElementById('botStatus').innerText = 'Awaiting OTP';
        document.getElementById('botStatus').style.color = '#34d399';
    }

    async function verifyAndSubmitOtp() {
        const otp = document.getElementById('mOtp').value.trim();
        if(!otp || otp.length !== 4) {
            alert('Enter valid 4-digit OTP');
            return;
        }

        const { phone, refCode } = tempSessionData;
        document.getElementById('botStatus').innerText = 'Verifying...';
        log(`[+] Verifying OTP ${otp} for ${phone} ...`);

        const payload = {
            "app_installer": "com.android.vending",
            "device_id": generateDeviceId(),
            "app_version": "10.2.8",
            "recaptcha_token": "",
            "app_signature": "",
            "guest_user_access": true,
            "ad_id": generateUuid(),
            "device_info": {"version_code": "12", "model": "SM-S9260", "incremental": "465", "display_ui": "V417IR", "brand": "Samsung"},
            "device_token": `${generateUuid().substring(0,22)}:APA91b${generateDeviceId()}`,
            "package_name": "com.app.smytten",
            "device_platform": "android",
            "app_path": "/data/user/0/com.app.smytten/files",
            "pincode_details": {"Answer": "New Delhi, India", "AnswerType": "ip"},
            "value": phone,
            "login_otp_code": otp,
            "is_mini": false
        };

        const data = await callSmyttenApi("/discover_user/users/verifyLoginOtpV2", payload, 'POST');
        const sessionId = data?.content?.session_id || data?.content?.authentication?.session_id;

        if(!sessionId) {
            log(`[-] Invalid OTP or Verification failed.`);
            alert('Invalid OTP. Please check and try again.');
            document.getElementById('botStatus').innerText = 'Awaiting OTP';
            return;
        }

        log(`[✓] OTP Verified! Session established.`);
        
        const firstNames = ["Rahul", "Amit", "Rohit", "Vikas", "Suresh", "Ravi", "Ankit", "Nikhil"];
        const first = firstNames[Math.floor(Math.random() * firstNames.length)];
        const email = `${first.toLowerCase()}${phone}@gmail.com`;

        const profilePayload = {
            "pincode": "110029",
            "gender": "male",
            "birth_month": Math.floor(Math.random() * 12) + 1,
            "name": first.toUpperCase(),
            "email": email,
            "birth_year": String(Math.floor(Math.random() * 8) + 1996),
            "invite_code": refCode
        };

        await callSmyttenApi("/discover_user/app/users/update_profile", profilePayload, 'PUT', sessionId);
        
        log(`[✓✓✓] SUCCESS! Referral code ${refCode} successfully bound to ${phone}`);
        
        let cnt = parseInt(document.getElementById('totalRefCnt').innerText) + 1;
        document.getElementById('totalRefCnt').innerText = cnt;

        document.getElementById('otpBox').classList.add('hidden');
        document.getElementById('mainActionBtn').style.display = 'block';
        document.getElementById('mPhone').value = '';
        document.getElementById('mOtp').value = '';
        document.getElementById('botStatus').innerText = 'Idle';
        document.getElementById('botStatus').style.color = '#fbbf24';
        alert('Success! Account verified and referral successfully credited.');
    }

    // Advanced Recursive Firebase Parser
    async function startFirebaseAuto() {
        const panelsText = document.getElementById('fbPanels').value.trim();
        const refCode = document.getElementById('fbRefCode').value.trim();
        const target = parseInt(document.getElementById('fbTarget').value) || 3;

        if(!panelsText) {
            alert('Please paste at least one Firebase panel URL.');
            return;
        }

        const urls = panelsText.split('\n').map(u => u.trim()).filter(u => u.length > 0);
        log(`[*] Scanning Firebase panels... (Target: ${target})`);
        document.getElementById('botStatus').innerText = 'Scanning...';
        document.getElementById('botStatus').style.color = '#d97706';

        let foundCount = 0;

        for (let url of urls) {
            if (foundCount >= target) break;
            try {
                let formattedUrl = url.endsWith('/') ? `${url}.json` : `${url}/.json`;
                let res = await fetch(`https://api.allorigins.win/raw?url=` + encodeURIComponent(formattedUrl));
                let data = await res.json();

                if (!data) {
                    log(`[!] Panel empty or inaccessible.`);
                    continue;
                }

                let numbers = [];
                function extractNumbers(node) {
                    if (!node) return;
                    if (typeof node === 'object') {
                        for (let key in node) {
                            extractNumbers(node[key]);
                        }
                    } else {
                        let val = String(node).trim();
                        // Match 10-digit Indian mobile numbers starting with 6-9
                        if (/^[6-9]\d{9}$/.test(val)) {
                            numbers.push(val);
                        }
                    }
                }
                extractNumbers(data);
                log(`[+] Found ${numbers.length} numbers in panel.`);

                for (let phone of numbers) {
                    if (foundCount >= target) break;
                    log(`[+] Checking number: ${phone}`);

                    let loginPayload = {
                        "app_installer": "com.android.vending",
                        "device_id": generateDeviceId(),
                        "app_version": "10.2.8",
                        "recaptcha_token": "",
                        "app_signature": "",
                        "guest_user_access": true,
                        "ad_id": generateUuid(),
                        "device_info": {"version_code": "12", "model": "SM-S9260", "incremental": "465", "display_ui": "V417IR", "brand": "Samsung"},
                        "device_token": `${generateUuid().substring(0,22)}:APA91b${generateDeviceId()}`,
                        "package_name": "com.app.smytten",
                        "device_platform": "android",
                        "app_path": "/data/user/0/com.app.smytten/files",
                        "pincode_details": {"Answer": "New Delhi, India", "AnswerType": "ip"},
                        "value": phone
                    };

                    let loginRes = await callSmyttenApi("/discover_user/users/loginViaNumberV2", loginPayload, 'POST');
                    let isNew = loginRes?.content?.is_new_user ?? loginRes?.content?.newUser ?? true;

                    if (isNew === false) {
                        log(`[!] ${phone} already registered. Skipping.`);
                        continue;
                    }

                    foundCount++;
                    log(`[✓] Fresh number found: ${phone} (Switch to Manual mode to enter OTP).`);
                }
            } catch(e) {
                log(`[-] Error reading panel: ${e.message}`);
            }
        }

        document.getElementById('botStatus').innerText = 'Idle';
        document.getElementById('botStatus').style.color = '#fbbf24';
        alert(`Firebase scan completed! Detected ${foundCount} fresh numbers.`);
    }
</script>

</body>
</html>
